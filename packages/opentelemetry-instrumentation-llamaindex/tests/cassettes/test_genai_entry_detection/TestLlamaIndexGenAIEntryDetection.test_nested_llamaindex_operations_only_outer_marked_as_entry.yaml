- request:
    body: "{\"messages\":[{\"role\":\"system\",\"content\":\"You are an expert Q&A
      system that is trusted around the world.\\nAlways answer the query using the
      provided context information, and not prior knowledge.\\nSome rules to follow:\\n1.
      Never directly reference the given context in your answer.\\n2. Avoid statements
      like 'Based on the context, ...' or 'The context information ...' or anything
      along those lines.\"},{\"role\":\"user\",\"content\":\"Context information is
      below.\\n---------------------\\nfile_path: /Users/caixuesen/Programming/oss/openllmetry/packages/opentelemetry-instrumentation-llamaindex/data/opentelemetry-docs/ai-agent-observability.md\\n\\n---\\ntitle:
      AI Agent Observability - Evolving Standards and Best Practices\\nauthor: >-\\n
      \ [Guangya Liu](https://github.com/gyliu513) (IBM), [Sujay\\n  Solomon](https://github.com/solsu01)
      (Google)\\nlinkTitle: AI Agent Observability\\nissue: https://github.com/open-telemetry/opentelemetry.io/issues/6389\\nsig:
      SIG GenAI Observability\\ndate: 2025-03-06\\ncSpell:ignore: genai Guangya PydanticAI
      Sujay\\n---\\n\\n## 2025: Year of AI agents\\n\\nAI Agents are becoming the
      next big leap in artificial intelligence in 2025.\\nFrom autonomous workflows
      to intelligent decision making, AI Agents will power\\nnumerous applications
      across industries. However, with this evolution comes the\\ncritical need for
      AI agent observability, especially when scaling these agents\\nto meet enterprise
      needs. Without proper monitoring, tracing, and logging\\nmechanisms, diagnosing
      issues, improving efficiency, and ensuring reliability in\\nAI agent-driven
      applications will be challenging.\\n\\n### What is an AI agent\\n\\nAn AI agent
      is an application that uses a combination of LLM capabilities, tools\\nto connect
      to the external world, and high-level reasoning to achieve a desired\\nend goal
      or state; Alternatively, agents can also be treated as systems where\\nLLMs
      dynamically direct their own processes and tool usage, maintaining control\\nover
      how they accomplish tasks.\\n\\n![Sample RAG based application w/ReAct reasoning/planning](ai-agent.png)\\n<small>_Image
      credit_:\\n[Google AI Agent Whitepaper](https://www.kaggle.com/whitepaper-agents).</small>\\n\\nFor
      more information about AI agents, see:\\n\\n- [Google: What is an AI agent?](https://cloud.google.com/discover/what-are-ai-agents)\\n-
      [IBM: What are AI agents?](https://www.ibm.com/think/topics/ai-agents)\\n- [MicroSoft:
      AI agents \u2014 what they are, and how they\u2019ll change the way we work](https://news.microsoft.com/source/features/ai/ai-agents-what-they-are-and-how-theyll-change-the-way-we-work/)\\n-
      [AWS: What are AI Agents?](https://aws.amazon.com/what-is/ai-agents/)\\n- [Anthropic:
      Building effective agents](https://www.anthropic.com/research/building-effective-agents)\\n\\n###
      Observability and beyond\\n\\nTypically, telemetry from applications is used
      to monitor and troubleshoot them.\\nIn the case of an AI agent, given its non-deterministic
      nature, telemetry is\\nalso used as a feedback loop to continuously learn from
      and improve the quality\\nof the agent by using it as input for evaluation tools.\\n\\nGiven
      that observability and evaluation tools for GenAI come from various\\nvendors,
      it is important to establish standards around the shape of the\\ntelemetry generated
      by agent apps to avoid lock-in caused by vendor or framework\\nspecific formats.\\n\\n##
      Current state of AI agent observability\\n\\nAs AI agent ecosystems continue
      to mature, the need for standardized and robust\\nobservability has become more
      apparent. While some frameworks offer built-in\\ninstrumentation, others rely
      on integration with observability tools. This\\nfragmented landscape underscores
      the importance of the\\n[GenAI observability project](https://github.com/open-telemetry/community/blob/main/projects/gen-ai.md)\\nand
      OpenTelemetry\u2019s emerging semantic conventions, which aim to unify how\\ntelemetry
      data is collected and reported.\\n\\n### Understanding AI agent application
      vs. AI agent framework\\n\\nIt is crucial to distinguish between **AI agent
      application** and **AI agent\\nframeworks**:\\n\\n- **AI agent application**
      refer to individual AI-driven entities that perform\\n  specific tasks autonomously.\\n-
      **AI agent framework** provide the necessary infrastructure to develop,\\n  manage,
      and deploy AI agents often in a more streamlined way than building an\\n  agent
      from scratch. Examples include the following:\\n  [IBM Bee AI](https://github.com/i-am-bee),\\n
      \ [IBM wxFlow](https://github.com/IBM/wxflows/),\\n  [CrewAI](https://www.crewai.com/),\\n
      \ [AutoGen](https://microsoft.github.io/autogen/dev/),\\n  [Semantic Kernel](https://github.com/microsoft/semantic-kernel),\\n
      \ [LangGraph](https://www.langchain.com/langgraph),\\n  [PydanticAI](https://ai.pydantic.dev/)
      and more.\\n\\n!\\n\\nfile_path: /Users/caixuesen/Programming/oss/openllmetry/packages/opentelemetry-instrumentation-llamaindex/data/opentelemetry-docs/ai-agent-observability.md\\n\\nAI
      agent framework\\n\\nIt is crucial to distinguish between **AI agent application**
      and **AI agent\\nframeworks**:\\n\\n- **AI agent application** refer to individual
      AI-driven entities that perform\\n  specific tasks autonomously.\\n- **AI agent
      framework** provide the necessary infrastructure to develop,\\n  manage, and
      deploy AI agents often in a more streamlined way than building an\\n  agent
      from scratch. Examples include the following:\\n  [IBM Bee AI](https://github.com/i-am-bee),\\n
      \ [IBM wxFlow](https://github.com/IBM/wxflows/),\\n  [CrewAI](https://www.crewai.com/),\\n
      \ [AutoGen](https://microsoft.github.io/autogen/dev/),\\n  [Semantic Kernel](https://github.com/microsoft/semantic-kernel),\\n
      \ [LangGraph](https://www.langchain.com/langgraph),\\n  [PydanticAI](https://ai.pydantic.dev/)
      and more.\\n\\n![AI agent application vs AI agent framework](agent-agent-framework.png)\\n\\n###
      Establishing a standardized semantic convention\\n\\nToday, the\\n[GenAI observability
      project](https://github.com/open-telemetry/community/blob/main/projects/gen-ai.md)\\nwithin
      OpenTelemetry is actively working on defining semantic conventions to\\nstandardize
      AI agent observability. This effort is primarily driven by:\\n\\n- **Agent application
      semantic convention** \u2013 A draft AI agent application\\n  semantic convention
      has already been established and finalized as part of the\\n  discussions in
      the\\n  [OpenTelemetry semantic conventions repository](https://github.com/open-telemetry/semantic-conventions/issues/1732).\\n
      \ The initial AI agent semantic convention is based on\\n  [Google's AI agent
      white paper](https://www.kaggle.com/whitepaper-agents),\\n  providing a foundational
      framework for defining observability standards.\\n  Moving forward, we will
      continue to refine and enhance this initial convention\\n  to make it more robust
      and comprehensive.\\n- **Agent framework semantic convention** \u2013 Now, the
      focus has shifted towards\\n  defining a common semantic convention for all
      AI agent frameworks. This effort\\n  is being discussed in\\n  [this OpenTelemetry
      issue](https://github.com/open-telemetry/semantic-conventions/issues/1530)\\n
      \ and aims to establish a standardized approach for frameworks such as IBM Bee\\n
      \ Stack, IBM wxFlow, CrewAI, AutoGen, LangGraph, and others. Additionally,\\n
      \ different AI Agent frameworks will be able to define their own Framework\\n
      \ Vendor Specific Semantic Convention while adhering to the common standard.\\n\\nBy
      establishing these conventions, we ensure that AI agent frameworks can report\\nstandardized
      metrics, traces, and logs, making it easier to integrate\\nobservability solutions
      and compare performance across different frameworks.\\n\\nNote: Experimental
      conventions already exist in OpenTelemetry for models at\\n[GenAI semantic convention](/docs/specs/semconv/gen-ai/).\\n\\n###
      Instrumentation approaches\\n\\nIn order to make a system observable, it must
      be instrumented: That is, code\\nfrom the system\u2019s components must\\n[emit
      traces, metrics, and logs](/docs/concepts/instrumentation/).\\n\\nDifferent
      AI agent frameworks have varying approaches to implementing\\nobservability,
      mainly categorized into two options:\\n\\n#### Option 1: Baked-in instrumentation\\n\\nThe
      first option is to implement built-in instrumentation that emits telemetry\\nusing
      OpenTelemetry semantic conventions. This means observability is a native\\nfeature,
      allowing users to seamlessly track agent performance, task execution,\\nand
      resource utilization. Some AI agent frameworks, such as CrewAI, follow this\\npattern.\\n\\nAs
      a developer of an agent framework, here are some pros and cons of this\\nbaked-in
      instrumentation:\\n\\n- Pros\\n  - You can take on the maintenance overhead
      of keeping the instrumentation for\\n    telemetry up-to-date.\\n  - Simplifies
      adoption for users unfamiliar with OpenTelemetry configuration.\\n  - Keep new
      features secret while providing instrumentation for them on the day\\n    of
      release.\\n- Cons\\n  - Adds bloat to the framework for users who do not need
      observability\\n    features.\\n  - Risk of version lock-in if the framework\u2019s
      OpenTelemetry dependencies lag\\n    behind upstream updates.\\n  - Less flexibility
      for advanced users who prefer custom instrumentation.\\n  - You may not get
      feedback/review from OTel contributors familiar with current\\n    semantic
      conventions.\\n  - Your instrumentation may lag with respect to best practices/conventions
      (not\\n    just the version of the OTel library dependencies).\\n- Some best
      practices to follow if you consider this approach:\\n  - Provide a configuration
      setting that lets users easily enable or disable\\n    telemetry collection
      from your framework's built-in instrumentation.\\n  - Plan ahead of users wanting
      to use other external instrumentation packages\\n    and avoid collision.\\n---------------------\\nGiven
      the context information and not prior knowledge, answer the query.\\nQuery:
      First query\\nAnswer: \"}],\"model\":\"qwen-turbo\",\"stream\":false,\"temperature\":0.1}"
