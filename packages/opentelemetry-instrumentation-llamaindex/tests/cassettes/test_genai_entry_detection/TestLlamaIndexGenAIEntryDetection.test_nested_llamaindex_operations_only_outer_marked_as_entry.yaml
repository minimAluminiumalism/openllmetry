- request:
    body: "{\"messages\":[{\"role\":\"system\",\"content\":\"You are an expert Q&A
      system that is trusted around the world.\\nAlways answer the query using the
      provided context information, and not prior knowledge.\\nSome rules to follow:\\n1.
      Never directly reference the given context in your answer.\\n2. Avoid statements
      like 'Based on the context, ...' or 'The context information ...' or anything
      along those lines.\"},{\"role\":\"user\",\"content\":\"Context information is
      below.\\n---------------------\\nfile_path: /Users/caixuesen/Programming/oss/openllmetry/packages/opentelemetry-instrumentation-llamaindex/data/opentelemetry-docs/ai-agent-observability.md\\n\\n---\\ntitle:
      AI Agent Observability - Evolving Standards and Best Practices\\nauthor: >-\\n
      \ [Guangya Liu](https://github.com/gyliu513) (IBM), [Sujay\\n  Solomon](https://github.com/solsu01)
      (Google)\\nlinkTitle: AI Agent Observability\\nissue: https://github.com/open-telemetry/opentelemetry.io/issues/6389\\nsig:
      SIG GenAI Observability\\ndate: 2025-03-06\\ncSpell:ignore: genai Guangya PydanticAI
      Sujay\\n---\\n\\n## 2025: Year of AI agents\\n\\nAI Agents are becoming the
      next big leap in artificial intelligence in 2025.\\nFrom autonomous workflows
      to intelligent decision making, AI Agents will power\\nnumerous applications
      across industries. However, with this evolution comes the\\ncritical need for
      AI agent observability, especially when scaling these agents\\nto meet enterprise
      needs. Without proper monitoring, tracing, and logging\\nmechanisms, diagnosing
      issues, improving efficiency, and ensuring reliability in\\nAI agent-driven
      applications will be challenging.\\n\\n### What is an AI agent\\n\\nAn AI agent
      is an application that uses a combination of LLM capabilities, tools\\nto connect
      to the external world, and high-level reasoning to achieve a desired\\nend goal
      or state; Alternatively, agents can also be treated as systems where\\nLLMs
      dynamically direct their own processes and tool usage, maintaining control\\nover
      how they accomplish tasks.\\n\\n![Sample RAG based application w/ReAct reasoning/planning](ai-agent.png)\\n<small>_Image
      credit_:\\n[Google AI Agent Whitepaper](https://www.kaggle.com/whitepaper-agents).</small>\\n\\nFor
      more information about AI agents, see:\\n\\n- [Google: What is an AI agent?](https://cloud.google.com/discover/what-are-ai-agents)\\n-
      [IBM: What are AI agents?](https://www.ibm.com/think/topics/ai-agents)\\n- [MicroSoft:
      AI agents \u2014 what they are, and how they\u2019ll change the way we work](https://news.microsoft.com/source/features/ai/ai-agents-what-they-are-and-how-theyll-change-the-way-we-work/)\\n-
      [AWS: What are AI Agents?](https://aws.amazon.com/what-is/ai-agents/)\\n- [Anthropic:
      Building effective agents](https://www.anthropic.com/research/building-effective-agents)\\n\\n###
      Observability and beyond\\n\\nTypically, telemetry from applications is used
      to monitor and troubleshoot them.\\nIn the case of an AI agent, given its non-deterministic
      nature, telemetry is\\nalso used as a feedback loop to continuously learn from
      and improve the quality\\nof the agent by using it as input for evaluation tools.\\n\\nGiven
      that observability and evaluation tools for GenAI come from various\\nvendors,
      it is important to establish standards around the shape of the\\ntelemetry generated
      by agent apps to avoid lock-in caused by vendor or framework\\nspecific formats.\\n\\n##
      Current state of AI agent observability\\n\\nAs AI agent ecosystems continue
      to mature, the need for standardized and robust\\nobservability has become more
      apparent. While some frameworks offer built-in\\ninstrumentation, others rely
      on integration with observability tools. This\\nfragmented landscape underscores
      the importance of the\\n[GenAI observability project](https://github.com/open-telemetry/community/blob/main/projects/gen-ai.md)\\nand
      OpenTelemetry\u2019s emerging semantic conventions, which aim to unify how\\ntelemetry
      data is collected and reported.\\n\\n### Understanding AI agent application
      vs. AI agent framework\\n\\nIt is crucial to distinguish between **AI agent
      application** and **AI agent\\nframeworks**:\\n\\n- **AI agent application**
      refer to individual AI-driven entities that perform\\n  specific tasks autonomously.\\n-
      **AI agent framework** provide the necessary infrastructure to develop,\\n  manage,
      and deploy AI agents often in a more streamlined way than building an\\n  agent
      from scratch. Examples include the following:\\n  [IBM Bee AI](https://github.com/i-am-bee),\\n
      \ [IBM wxFlow](https://github.com/IBM/wxflows/),\\n  [CrewAI](https://www.crewai.com/),\\n
      \ [AutoGen](https://microsoft.github.io/autogen/dev/),\\n  [Semantic Kernel](https://github.com/microsoft/semantic-kernel),\\n
      \ [LangGraph](https://www.langchain.com/langgraph),\\n  [PydanticAI](https://ai.pydantic.dev/)
      and more.\\n\\n!\\n\\nfile_path: /Users/caixuesen/Programming/oss/openllmetry/packages/opentelemetry-instrumentation-llamaindex/data/opentelemetry-docs/ai-agent-observability.md\\n\\n-
      Simplifies adoption for users unfamiliar with OpenTelemetry configuration.\\n
      \ - Keep new features secret while providing instrumentation for them on the
      day\\n    of release.\\n- Cons\\n  - Adds bloat to the framework for users who
      do not need observability\\n    features.\\n  - Risk of version lock-in if the
      framework\u2019s OpenTelemetry dependencies lag\\n    behind upstream updates.\\n
      \ - Less flexibility for advanced users who prefer custom instrumentation.\\n
      \ - You may not get feedback/review from OTel contributors familiar with current\\n
      \   semantic conventions.\\n  - Your instrumentation may lag with respect to
      best practices/conventions (not\\n    just the version of the OTel library dependencies).\\n-
      Some best practices to follow if you consider this approach:\\n  - Provide a
      configuration setting that lets users easily enable or disable\\n    telemetry
      collection from your framework's built-in instrumentation.\\n  - Plan ahead
      of users wanting to use other external instrumentation packages\\n    and avoid
      collision.\\n  - Consider listing your agent framework in the\\n    [OpenTelemetry
      registry](/ecosystem/registry/) if you choose this path.\\n- As a developer
      of an agent application, you may want to choose an agent\\n  framework with
      baked-in instrumentation if\u2026\\n  - Minimal dependencies on external packages
      in your agent app code.\\n  - Out-of-the-box observability without manual setup.\\n\\n####
      Option 2: Instrumentation via OpenTelemetry\\n\\nThis option is to publish OpenTelemetry
      instrumentation libraries to some GitHub\\nrepositories. These instrumentation
      libraries can be imported into agents and\\nconfigured to emit telemetry per
      OpenTelemetry semantic conventions.\\n\\nFor publishing instrumentation with
      OpenTelemetry, there are two options:\\n\\n- Option 1: External instrumentation
      in your own repository/package, like\\n  [Traceloop OpenTelemetry Instrumentation](https://github.com/traceloop/openllmetry/tree/main/packages),\\n
      \ [Langtrace OpenTelemetry Instrumentation](https://github.com/Scale3-Labs/langtrace-python-sdk/tree/main/src/langtrace_python_sdk/instrumentation)\\n
      \ etc.\\n- Option 2: External instrumentation in OpenTelemetry owned repository,
      like\\n  [instrumentation-genai](https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation-genai)\\n
      \ etc.\\n\\nBoth options work well, but the long term goal is to host the code
      in\\nOpenTelemetry owned repositories, like Traceloop is trying to\\n[donate
      the instrumentation code](https://github.com/open-telemetry/community/issues/2571)\\nto
      OpenTelemetry now.\\n\\nAs a developer of an agent framework, here are some
      pros and cons of\\ninstrumentation with OpenTelemetry:\\n\\n- Pros\\n  - Decouples
      observability from the core framework, reducing bloat.\\n  - Leverages OpenTelemetry\u2019s
      community-driven maintenance for instrumentation\\n    updates.\\n  - Allows
      users to mix and match contrib libraries for their specific needs\\n    (e.g.,
      cloud providers, LLM vendors).\\n  - More likely to leverage best practices
      around semantic conventions and\\n    zero-code instrumentation\\n- Cons\\n
      \ - Risk of fragmentation if users rely on incompatible or outdated contrib\\n
      \   packages for both install time and runtime.\\n  - Development velocity slows
      down when there are too many PRs in the\\n    OpenTelemetry review queue.\\n-
      Best practices for this approach:\\n  - Ensure compatibility with popular OpenTelemetry
      contrib libraries (e.g., LLM\\n    vendors, vector DBs).\\n  - Provide clear
      documentation on recommended contrib packages and\\n    configuration examples.\\n
      \ - Avoid reinventing the wheel; align with existing OpenTelemetry standards.\\n-
      As a developer of an agent application, you may want to choose an agent\\n  framework
      with baked-in instrumentation if\u2026\\n  - You need fine-grained control over
      telemetry sources and destinations.\\n  - Your use case requires integrating
      observability with niche or custom tools.\\n\\n**NOTE:** Regardless of the approach
      taken, it is essential that all AI agent\\nframeworks adopt the AI agent framework
      semantic convention to ensure\\ninteroperability and consistency in observability
      data.\\n\\n## Future of AI agent observability\\n\\nLooking ahead, AI agent
      observability will continue to evolve with:\\n\\n- **More robust semantic conventions**
      to cover edge cases and emerging AI agent\\n  frameworks.\\n- **A unified AI
      agent framework semantic convention** to ensure\\n  interoperability across
      different frameworks while allowing flexibility for\\n  vendor-specific extensions.\\n-
      **Continuous improvements to the AI agent semantic convention** to refine the\\n
      \ initial standard and address new challenges as AI agents evolve.\\n- **Improved
      tooling** for monitoring, debugging, and optimizing AI agents.\\n- **Tighter
      integration with AI model observability** to provide end-to-end\\n  visibility
      into AI powered applications.\\n---------------------\\nGiven the context information
      and not prior knowledge, answer the query.\\nQuery: Second query\\nAnswer: \"}],\"model\":\"qwen-turbo\",\"stream\":false,\"temperature\":0.1}"
